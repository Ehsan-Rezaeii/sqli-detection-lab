name: research-prototype
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q --cov=sqli_detection_lab --cov-report=xml --cov-report=term-missing
      - run: sqli-lab smoke
      - name: Freeze and final artifact checks
        shell: bash
        run: |
          if test -f results/FINALIZED; then
            test -f results/final/completion.json
            sqli-lab audit --require-final
          elif test -f results/freeze.json; then
            sqli-lab audit
            echo 'Pre-final freeze: final artifact checks await the one scoring pass.'
          else
            echo 'Development phase: core and synthetic tests only.'
          fi
      - run: python -m build
      - name: Clean wheel installation and import
        shell: bash
        run: |
          python -m venv /tmp/sqli-wheel
          /tmp/sqli-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sqli-wheel/bin/python -c 'from sqli_detection_lab.api import create_app; from metaheuristics_lab import BinaryGA; assert BinaryGA(population_size=12).population_size == 12; print(create_app().title)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
